name: Build S25 Ultra APK - Glass Transfer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix icons so build never crashes
        run: |
          ls -l assets/ || true
          cp assets/icon.png assets/adaptive-icon.png || true
          cp assets/icon.png assets/splash.png || true
          cp assets/icon.png assets/favicon.png || true

      - name: Fix bad package version that crashes at 25s
        run: |
          sed -i 's/16.0.9/16.0.5/g' package.json || true
          cat package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --clean --platform android

      - name: Fix splashscreen background missing that crashes at 3m34s
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="splashscreen_background">#000000</color></resources>' > android/app/src/main/res/values/splash_fix.xml
          cat android/app/src/main/res/values/splash_fix.xml

      - name: Build RELEASE APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Transfer-FINAL-APK
          path: android/app/build/outputs/apk/release/app-release.apk
