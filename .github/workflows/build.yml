name: Build S25 Ultra APK - Glass Transfer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix icons so build never crashes
        run: |
          cp assets/icon.png assets/adaptive-icon.png || true

      - name: Fix bad package version that crashed at 25s
        run: |
          sed -i 's/16.0.9/16.0.5/g' package.json || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --clean --platform android

      - name: Build RELEASE APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Transfer-FINAL-APK
          path: android/app/build/outputs/apk/release/app-release.apk
