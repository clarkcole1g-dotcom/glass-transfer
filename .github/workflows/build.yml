name: Build S25 Ultra APK - Glass Transfer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix icons so build never crashes
        run: |
          mkdir -p assets
          cp assets/icon.png assets/adaptive-icon.png || true
          cp assets/icon.png assets/splash-icon.png || true
          cp assets/icon.png assets/favicon.png || true
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Prebuild Android
        run: npx expo prebuild --clean --platform android
      - name: Build RELEASE APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Transfer-FINAL-APK
          path: android/app/build/outputs/apk/release/app-release.apk
